name: versiculo_na_tela
description: "Um versículo bíblico sempre visível na tela do celular."
publish_to: 'none'
version: 0.1.10+11

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Estado
  provider: ^6.1.2

  # Armazenamento local (favoritos, histórico, configurações) — funciona 100% offline
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # Ponte Flutter -> widget nativo (grava em SharedPreferences no Android e
  # em UserDefaults de App Group no iOS, que são lidos pelo widget nativo
  # sem precisar do motor Flutter rodando)
  home_widget: ^0.7.0

  # Notificação local do "versículo diário" (usa APIs oficiais de notificação
  # de cada plataforma por baixo)
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^4.1.1
  # Player único de oração, com controles de mídia no Android/iOS.
  just_audio: 0.9.46
  just_audio_background: 0.0.1-beta.15
  audio_service: 0.18.17
  flutter_tts: 4.2.3

  # Compartilhar a imagem gerada do versículo pelos recursos nativos do SO
  share_plus: ^10.0.2

  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.11
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Italic.ttf
          style: italic
  assets:
    - assets/brand_icon.png
    - assets/verses.json
    - assets/taxonomia_temas.json
    - assets/prayer_demo.mp3
